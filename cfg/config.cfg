// If the user doesn't have a config.cfg when they run, this gets executed the first time they run the engine
// It doesn't execute if they have their own config.cfg saved out.

bind "`"			"toggleconsole"

bind "w"			"+forward"
bind "s"			"+back"
bind "a"			"+moveleft"
bind "d"			"+moveright"
bind "SPACE"		"+jump"
bind "SHIFT"		"+speed"
bind "CTRL"			"+duck"
bind "r"			"+reload"
bind "e"			"+helpme"
bind "f"			"+use"
bind "l"			"dropitem"
bind "g"			"+taunt"
bind "t"			"impulse 201"

bind "MOUSE1"		"+attack"
bind "MOUSE2"		"+attack2"
bind "MWHEELUP"		"invprev"
bind "MWHEELDOWN"	"invnext"

bind "q"			"lastinv"
bind "1"			"slot1"
bind "2"			"slot2"
bind "3"			"slot3"
bind "4"			"slot4"
bind "5"			"slot5"
bind "6"			"slot6"
bind "7"			"slot7"
bind "8"			"slot8"
bind "9"			"slot9"
bind "0"			"slot0"

bind "b"			"lastdisguise"
bind "-"			"disguiseteam"

bind "y"			"say"
bind "u"			"say_team"
bind "z"			"voice_menu_1"
bind "x"			"voice_menu_2"
bind "c"			"voice_menu_3"
bind "v"			"+voicerecord"

bind "rightarrow"	"spec_next"
bind "leftarrow"	"spec_prev"
bind "TAB"			"+showscores"
bind "."			"changeteam"
bind ","			"changeclass"
bind "m"			"open_charinfo_direct"
bind "i"			"showmapinfo"

bind "F1"			"player_ready_toggle"
bind "F5"			"screenshot"
bind "ESCAPE"		"escape"

volume 0.15